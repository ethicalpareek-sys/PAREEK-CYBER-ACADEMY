<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#0a1a24"/>
      <stop offset="45%" stop-color="#050b12"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>

    <!-- Cyber text gradient (metallic) -->
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#b8fff0"/>
      <stop offset="65%" stop-color="#3fe0c8"/>
      <stop offset="100%" stop-color="#0d5a52"/>
    </linearGradient>

    <!-- Accent line -->
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffd1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffd1"/>
      <stop offset="100%" stop-color="#00ffd1" stop-opacity="0"/>
    </linearGradient>

    <!-- Floor glow (fades to depth) -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffd1" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ffd1" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Core glow -->
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffd1" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#00ffd1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ffd1" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue glow -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield gradient -->
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffd1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#004a44" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Text depth shadow -->
    <filter id="textDepth" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#000" flood-opacity="0.9"/>
    </filter>

    <!-- Outer glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══════════ BACKGROUND ═══════════ -->
  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- ═══════════ 3D FLOOR (perspective grid) ═══════════ -->
  <g opacity="0.55">
    <!-- Horizontal lines (receding) -->
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#00ffd1" stroke-width="2"/>
    <line x1="0" y1="470" x2="1200" y2="470" stroke="#00ffd1" stroke-width="1.2"/>
    <line x1="0" y1="445" x2="1200" y2="445" stroke="#00ffd1" stroke-width="0.8"/>
    <line x1="0" y1="425" x2="1200" y2="425" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="0" y1="410" x2="1200" y2="410" stroke="#00ffd1" stroke-width="0.5"/>
    <line x1="0" y1="398" x2="1200" y2="398" stroke="#00ffd1" stroke-width="0.4"/>
    <line x1="0" y1="388" x2="1200" y2="388" stroke="#00ffd1" stroke-width="0.3"/>

    <!-- Vertical converging lines to vanishing point (600, 340) -->
    <line x1="0" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="100" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="200" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="300" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="400" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="500" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="600" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="700" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="800" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="900" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="1000" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="1100" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
    <line x1="1200" y1="500" x2="600" y2="340" stroke="#00ffd1" stroke-width="0.6"/>
  </g>

  <!-- Floor glow (fade to depth) -->
  <rect y="340" width="1200" height="160" fill="url(#floor)" opacity="0.35"/>

  <!-- ═══════════ 3D CEILING (top perspective) ═══════════ -->
  <g opacity="0.3">
    <line x1="0" y1="0" x2="600" y2="160" stroke="#5b8cff" stroke-width="0.6"/>
    <line x1="200" y1="0" x2="600" y2="160" stroke="#5b8cff" stroke-width="0.6"/>
    <line x1="400" y1="0" x2="600" y2="160" stroke="#5b8cff" stroke-width="0.6"/>
    <line x1="600" y1="0" x2="600" y2="160" stroke="#5b8cff" stroke-width="0.6"/>
    <line x1="800" y1="0" x2="600" y2="160" stroke="#5b8cff" stroke-width="0.6"/>
    <line x1="1000" y1="0" x2="600" y2="160" stroke="#5b8cff" stroke-width="0.6"/>
    <line x1="1200" y1="0" x2="600" y2="160" stroke="#5b8cff" stroke-width="0.6"/>
  </g>

  <!-- ═══════════ AMBIENT GLOWS ═══════════ -->
  <ellipse cx="600" cy="250" rx="500" ry="200" fill="url(#core)"/>
  <ellipse cx="120" cy="120" rx="280" ry="140" fill="url(#blueGlow)"/>
  <ellipse cx="1080" cy="380" rx="280" ry="140" fill="url(#blueGlow)"/>

  <!-- ═══════════ 3D ROTATING RINGS (around title) ═══════════ -->
  <!-- Back rings (behind text) -->
  <g fill="none">
    <ellipse cx="600" cy="250" rx="380" ry="120" stroke="#00ffd1" stroke-width="1.2" opacity="0.22" transform="rotate(-8 600 250)"/>
    <ellipse cx="600" cy="250" rx="440" ry="140" stroke="#5b8cff" stroke-width="0.8" opacity="0.18" transform="rotate(6 600 250)"/>
    <ellipse cx="600" cy="250" rx="320" ry="100" stroke="#3fe0c8" stroke-width="0.6" opacity="0.28" transform="rotate(-15 600 250)"/>
  </g>

  <!-- ═══════════ FLOATING NETWORK NODES (3D depth) ═══════════ -->
  <g opacity="0.75">
    <!-- Left cluster -->
    <circle cx="120" cy="180" r="3" fill="#00ffd1" filter="url(#glow)"/>
    <circle cx="200" cy="140" r="2" fill="#3fe0c8"/>
    <circle cx="90" cy="280" r="2.5" fill="#00ffd1"/>
    <circle cx="180" cy="320" r="2" fill="#5b8cff"/>
    <line x1="120" y1="180" x2="200" y2="140" stroke="#00ffd1" stroke-width="0.5" opacity="0.5"/>
    <line x1="120" y1="180" x2="90" y2="280" stroke="#00ffd1" stroke-width="0.5" opacity="0.5"/>
    <line x1="90" y1="280" x2="180" y2="320" stroke="#5b8cff" stroke-width="0.5" opacity="0.5"/>

    <!-- Right cluster -->
    <circle cx="1080" cy="160" r="3" fill="#00ffd1" filter="url(#glow)"/>
    <circle cx="1010" cy="120" r="2" fill="#3fe0c8"/>
    <circle cx="1120" cy="270" r="2.5" fill="#00ffd1"/>
    <circle cx="1030" cy="320" r="2" fill="#5b8cff"/>
    <line x1="1080" y1="160" x2="1010" y2="120" stroke="#00ffd1" stroke-width="0.5" opacity="0.5"/>
    <line x1="1080" y1="160" x2="1120" y2="270" stroke="#00ffd1" stroke-width="0.5" opacity="0.5"/>
    <line x1="1120" y1="270" x2="1030" y2="320" stroke="#5b8cff" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- ═══════════ CORNER HUD FRAMES ═══════════ -->
  <g stroke="#00ffd1" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M30 90 L30 30 L90 30"/>
    <path d="M1110 30 L1170 30 L1170 90"/>
    <path d="M30 410 L30 470 L90 470"/>
    <path d="M1170 410 L1170 470 L1110 470"/>
  </g>

  <!-- Corner accents -->
  <g fill="#00ffd1">
    <rect x="28" y="28" width="4" height="4"/>
    <rect x="1168" y="28" width="4" height="4"/>
    <rect x="28" y="468" width="4" height="4"/>
    <rect x="1168" y="468" width="4" height="4"/>
  </g>

  <!-- ═══════════ TOP HUD TEXT ═══════════ -->
  <text x="60" y="60" font-family="'JetBrains Mono',monospace" font-size="11" fill="#00ffd1" letter-spacing="5">◈ SYSTEM · ONLINE</text>
  <text x="1140" y="60" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5b8cff" letter-spacing="5" text-anchor="end">PCA · 2025</text>
  <line x1="60" y1="75" x2="280" y2="75" stroke="url(#acc)" stroke-width="1"/>
  <line x1="920" y1="75" x2="1140" y2="75" stroke="url(#acc)" stroke-width="1"/>

  <!-- ═══════════ TOP STATUS DOTS ═══════════ -->
  <g opacity="0.9">
    <circle cx="560" cy="60" r="3" fill="#3fe0c8"/>
    <circle cx="580" cy="60" r="3" fill="#3fe0c8" opacity="0.5"/>
    <circle cx="600" cy="60" r="3" fill="#00ffd1" filter="url(#glow)"/>
    <circle cx="620" cy="60" r="3" fill="#3fe0c8" opacity="0.5"/>
    <circle cx="640" cy="60" r="3" fill="#3fe0c8"/>
  </g>

  <!-- ═══════════ SHIELD EMBLEM (left of title) ═══════════ -->
  <g transform="translate(180, 210)" opacity="0.85">
    <path d="M 0 -60 L 55 -35 L 55 25 Q 55 55 0 75 Q -55 55 -55 25 L -55 -35 Z"
          fill="url(#shield)" stroke="#00ffd1" stroke-width="1.5" filter="url(#softGlow)"/>
    <path d="M -20 -15 L 0 5 L 25 -25" fill="none" stroke="#001a18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ═══════════ SHIELD EMBLEM (right of title) ═══════════ -->
  <g transform="translate(1020, 210) scale(0.7)" opacity="0.6">
    <circle r="60" fill="none" stroke="#5b8cff" stroke-width="1.5"/>
    <circle r="45" fill="none" stroke="#5b8cff" stroke-width="0.8"/>
    <circle r="28" fill="none" stroke="#00ffd1" stroke-width="1"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#5b8cff" stroke-width="0.6"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#5b8cff" stroke-width="0.6"/>
    <circle r="6" fill="#00ffd1" filter="url(#glow)"/>
  </g>

  <!-- ═══════════ MAIN TITLE — 3D EXTRUSION ═══════════ -->
  <!-- Deep shadow layers (3D extrusion going down-right) -->
  <g font-family="'Space Grotesk',system-ui,sans-serif" font-weight="900" font-size="120" text-anchor="middle" letter-spacing="4">
    <text x="606" y="266" fill="#000000" opacity="0.75">PAREEK</text>
    <text x="604" y="264" fill="#001510" opacity="0.8">PAREEK</text>
    <text x="602" y="262" fill="#002a20" opacity="0.9">PAREEK</text>
    <text x="600" y="260" fill="#004a3a" opacity="0.9">PAREEK</text>
  </g>

  <!-- Main text with metallic gradient + glow -->
  <text x="600" y="258"
        font-family="'Space Grotesk',system-ui,sans-serif"
        font-weight="900" font-size="120"
        text-anchor="middle" letter-spacing="4"
        fill="url(#metal)"
        filter="url(#glow)">PAREEK</text>

  <!-- ═══════════ SUBTITLE — 3D EXTRUSION ═══════════ -->
  <g font-family="'Space Grotesk',system-ui,sans-serif" font-weight="700" font-size="52" text-anchor="middle" letter-spacing="10">
    <text x="604" y="324" fill="#001510" opacity="0.85">CYBER ACADEMY</text>
    <text x="602" y="322" fill="#003830" opacity="0.9">CYBER ACADEMY</text>
  </g>
  <text x="600" y="320"
        font-family="'Space Grotesk',system-ui,sans-serif"
        font-weight="700" font-size="52"
        text-anchor="middle" letter-spacing="10"
        fill="#3fe0c8"
        filter="url(#softGlow)">CYBER ACADEMY</text>

  <!-- ═══════════ TAGLINE ═══════════ -->
  <g font-family="'JetBrains Mono',monospace" font-size="16" text-anchor="middle" letter-spacing="12">
    <text x="600" y="378" fill="#000" opacity="0.6" y="380">LEARN • BUILD • DEFEND</text>
    <text x="600" y="378" fill="#e2edf5">LEARN • BUILD • DEFEND</text>
  </g>

  <!-- Divider lines around tagline -->
  <line x1="280" y1="372" x2="360" y2="372" stroke="url(#acc)" stroke-width="1"/>
  <line x1="840" y1="372" x2="920" y2="372" stroke="url(#acc)" stroke-width="1"/>

  <!-- ═══════════ BOTTOM HUD ═══════════ -->
  <text x="600" y="440" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5f7182" text-anchor="middle" letter-spacing="8">◈ AUTHORIZED LABS · ORIGINAL CTF · ETHICAL SECURITY ◈</text>

  <line x1="60" y1="425" x2="280" y2="425" stroke="url(#acc)" stroke-width="1" opacity="0.6"/>
  <line x1="920" y1="425" x2="1140" y2="425" stroke="url(#acc)" stroke-width="1" opacity="0.6"/>

  <!-- ═══════════ FLOATING CYBER WORDS (3D scattered) ═══════════ -->
  <g font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="3" opacity="0.5">
    <text x="80" y="240" fill="#3fe0c8" font-size="8">NETWORKING</text>
    <text x="80" y="255" fill="#5b8cff" font-size="8">LINUX · PYTHON</text>
    <text x="1060" y="240" fill="#3fe0c8" font-size="8" text-anchor="end">PENTESTING</text>
    <text x="1060" y="255" fill="#5b8cff" font-size="8" text-anchor="end">OSINT · CTF</text>
  </g>

  <!-- Scan-line texture -->
  <g opacity="0.04">
    <line x1="0" y1="10" x2="1200" y2="10" stroke="#00ffd1"/>
    <line x1="0" y1="30" x2="1200" y2="30" stroke="#00ffd1"/>
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#00ffd1"/>
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#00ffd1"/>
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#00ffd1"/>
  </g>
</svg>
