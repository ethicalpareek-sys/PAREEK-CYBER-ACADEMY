  <text x="600" y="380" font-family="monospace" font-size="16" text-anchor="middle" letter-spacing="12" fill="#000000" opacity="0.6">LEARN • BUILD • DEFEND</text>
  <text x="600" y="378" font-family="monospace" font-size="16" text-anchor="middle" letter-spacing="12" fill="#e2edf5">LEARN • BUILD • DEFEND</text>

