  <text x="604" y="324" font-family="sans-serif" font-weight="700" font-size="52" text-anchor="middle" letter-spacing="10" fill="#001510" opacity="0.85">CYBER ACADEMY</text>
  <text x="602" y="322" font-family="sans-serif" font-weight="700" font-size="52" text-anchor="middle" letter-spacing="10" fill="#003830" opacity="0.9">CYBER ACADEMY</text>
