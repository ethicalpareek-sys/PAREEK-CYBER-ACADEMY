<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#0a1a24"/>
      <stop offset="45%" stop-color="#050b12"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#b8fff0"/>
      <stop offset="65%" stop-color="#3fe0c8"/>
      <stop offset="100%" stop-color="#0d5a52"/>
    </linearGradient>

    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffd1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffd1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ffd1" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffd1" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#00ffd1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00ffd1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffd1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#004a44" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <g opacity="0.5" stroke="#00ffd1" fill="none">
